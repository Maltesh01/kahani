spring:
  application:
    name: kahani-api
  profiles:
    default: local
    group:
      demo: local
  data:
    redis:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
  error:
    include-stacktrace: never
