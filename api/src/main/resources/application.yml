spring:
  application:
    name: kahani-api
  datasource:
    url: jdbc:h2:mem:kahani
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${KAHANI_SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-stacktrace: never
