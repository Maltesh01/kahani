services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      KAHANI_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:8080"
